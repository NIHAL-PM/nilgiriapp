name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: nilgiri
        run: flutter pub get

      - name: Build release APK
        working-directory: nilgiri
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nilgiriapp
          path: nilgiri/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Nilgiri College App v1.0.0"
          body: |
            ## Nilgiri College Mobile App Release
            
            - **App Icon**: Official Nilgiri College circular logo on launcher and home screen.
            - **Splash Screen**: Pure white animated splash screen with centered emblem and attribution.
            - **Native In-App Container**: Strict in-app navigation (external web browsers will never open), pull-to-refresh, top progress bar, and campus Wi-Fi offline screen.
            
            ### Download
            Directly download **app-release.apk** below to install on your Android device.
          draft: false
          prerelease: false
          make_latest: true
          files: nilgiri/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
